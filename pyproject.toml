[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-kvmgr"
version = "0.6.0"
description = "A hot-configurable KV cache manager and a disk-backed, cross-node prefix cache for vLLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# THE vLLM 0.31 LINE (branch vllm-0.31, versions 0.5.x). main (0.4.x) is
# the 0.21 line the cluster runs. Proven on vLLM 0.31.0 (CPU, Apple container)
# and a 0.31-shaped dev build on a GB10 (0.30.1rc1.dev631), single node only;
# not yet on the cluster (docs/plan-0.31-port.md step 4). kvmgr wraps private
# vLLM internals, so a version inside the window is not a promise.
dependencies = ["vllm>=0.32.0,<0.33"]

[project.urls]
Homepage = "https://github.com/sjhorn/vllm-kvmgr"
Issues = "https://github.com/sjhorn/vllm-kvmgr/issues"

[project.entry-points."vllm.general_plugins"]
kvmgr = "kvmgr:register"

[tool.setuptools.packages.find]
where = ["src"]
